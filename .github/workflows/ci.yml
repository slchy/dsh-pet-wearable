name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  guards:
    name: Guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/dsh-voice-web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (web package)
        run: npm --prefix packages/dsh-voice-web ci

      - name: Secret scan
        run: npm run verify:secrets

      - name: Typecheck (root)
        run: npm run typecheck

      - name: Typecheck (web package)
        run: npm --prefix packages/dsh-voice-web run typecheck

      - name: Time knob invariants
        run: python scripts/time-knobs.py --check

      - name: Formal verification (FSM + backchannel)
        run: npm run verify:formal

      - name: Mutation check
        run: npm run mutate

  test-matrix:
    name: Test ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
            pack: false
            low_concurrency: true
          - os: ubuntu-latest
            node: '24'
            pack: true
            low_concurrency: false
          # Windows 跑 Node 24（避开 Node 22.x Windows 下 node:test #processRawBuffer 的偶发 IPC 抖动；
          # Node 22 下限兼容性继续由 ubuntu-latest / Node 22 守住）
          - os: windows-latest
            node: '24'
            pack: false
            low_concurrency: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/dsh-voice-web/package-lock.json

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (web package)
        run: npm --prefix packages/dsh-voice-web ci

      - name: Run all tests
        if: ${{ !matrix.low_concurrency }}
        run: npm run test:all

      # Node 22.x 的 `node --test` 默认 `--test-isolation=process` 会在父子 IPC 管线里偶发触发
      # `#processRawBuffer: Unable to deserialize cloned data`（上游在 Node 24 修复）。
      # 用 xargs 按单文件起独立进程 + `--test-isolation=none`：保持 100% 进程级隔离，同时彻底绕开该 IPC 路径。
      - name: Run all tests (Node 22 per-file process isolation)
        if: ${{ matrix.low_concurrency }}
        run: |
          set -euo pipefail
          printf '%s\n' tests/*.test.ts tests/contracts/*.test.ts \
            | xargs -r -P 4 -n 1 node --test --test-isolation=none
          printf '%s\n' bench/eval/*.test.ts bench/replay/*.test.ts \
            | xargs -r -P 4 -n 1 node --test --test-isolation=none
          (
            cd packages/dsh-voice-web
            npm run sync:voice
            printf '%s\n' tests/*.test.ts \
              | xargs -r -P 4 -n 1 node --test --test-isolation=none
          )

      - name: Build web package
        if: matrix.pack
        run: npm --prefix packages/dsh-voice-web run build

      - name: Verify package contents
        if: matrix.pack
        run: npm run verify:pack
