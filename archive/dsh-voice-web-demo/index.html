<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>dsh-pet-voice · web</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #0e1116;
    --fg: #e6edf3;
    --dim: #8b949e;
    --line: #232b36;
    --accent: #4c9aff;
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f8fa; --fg: #1f2328; --dim: #636c76; --line: #d0d7de; --accent: #0969da; }
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: max(1.5rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
  }
  main { width: min(32rem, 100%); display: flex; flex-direction: column; gap: 1.1rem; flex: 1; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  h1 { font-size: 1rem; margin: 0; font-weight: 600; letter-spacing: .02em; }
  h1 small { color: var(--dim); font-weight: 400; }

  .pill {
    font-size: 12px; padding: .2rem .6rem; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
  }
  .pill[data-state="live"] { color: var(--accent); border-color: currentColor; }
  .pill[data-state="speaking"] { color: var(--ok); border-color: currentColor; }
  .pill[data-state="error"] { color: var(--err); border-color: currentColor; }

  /* 麦克风电平：用 scaleX 撑，不触发布局 */
  .meter { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .meter > i {
    display: block; height: 100%; width: 100%; transform-origin: left center;
    transform: scaleX(0); background: var(--accent); transition: transform 90ms linear;
  }

  .controls { display: flex; gap: .6rem; }
  button {
    font: inherit; cursor: pointer; border-radius: .5rem;
    border: 1px solid var(--line); background: transparent; color: inherit;
    padding: .7rem 1.1rem; flex: 1; transition: background 120ms;
  }
  button:hover:not(:disabled) { background: color-mix(in srgb, currentColor 8%, transparent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button.primary[data-running="true"] { border-color: var(--err); color: var(--err); }

  .measure { border-top: 1px solid var(--line); padding-top: .8rem; display: grid; gap: .35rem; }
  .measure h2 { font-size: 13px; margin: 0 0 .2rem; font-weight: 600; color: var(--dim); }
  .row { display: flex; justify-content: space-between; gap: 1rem; font-size: 13px; }
  .row b { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-weight: 600; }
  .verdict { font-size: 13px; margin: .3rem 0 0; }
  .verdict[data-level="ok"] { color: var(--ok); }
  .verdict[data-level="tight"] { color: var(--warn); }
  .verdict[data-level="bad"] { color: var(--err); }

  details { border-top: 1px solid var(--line); padding-top: .7rem; }
  summary { cursor: pointer; color: var(--dim); font-size: 13px; }
  pre {
    margin: .6rem 0 0; padding: .7rem; max-height: 34vh; overflow: auto;
    background: color-mix(in srgb, currentColor 5%, transparent);
    border-radius: .4rem; font-size: 12px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  .notice { font-size: 13px; color: var(--warn); }
  .require {
    display: flex; gap: .6rem; align-items: flex-start;
    padding: .65rem .8rem; border-radius: .5rem; font-size: 13px; line-height: 1.5;
    border: 1px solid color-mix(in srgb, var(--warn) 55%, transparent);
    background: color-mix(in srgb, var(--warn) 12%, transparent);
    color: var(--warn);
  }
  .require b { font-weight: 700; }
</style>
</head>
<body>
<main>
  <header>
    <h1>dsh-pet-voice <small>web</small></h1>
    <span class="pill" id="pill" data-state="idle">未开始</span>
  </header>

  <div class="require">
    <span>🎧</span>
    <span><b>请戴耳机。</b>这条链路不做回声消除 —— 用外放时它自己的声音会被当成你在说话，
      于是它一直打断自己。戴耳机之后声学回声路径就不存在了。</span>
  </div>

  <div class="meter" aria-label="麦克风电平"><i id="level"></i></div>

  <div class="controls">
    <button class="primary" id="toggle" data-running="false">开始对话</button>
    <button id="hush" disabled>立即静音</button>
  </div>

  <div class="notice" id="notice" hidden></div>

  <section class="measure">
    <h2>回声余量（确认耳机是否真的生效）</h2>
    <div class="row"><span>静默期峰值</span><b id="m-noise">—</b></div>
    <div class="row"><span>播放期峰值</span><b id="m-echo">—</b></div>
    <div class="row"><span>对门限（−40 dBFS）</span><b id="m-margin">—</b></div>
    <p class="verdict" id="m-verdict">戴好耳机后点「测回声余量」，期间请保持安静。</p>
    <div class="controls"><button id="probe" disabled>测回声余量</button></div>
  </section>

  <details>
    <summary>日志</summary>
    <pre id="log"></pre>
  </details>
</main>

<script type="module" src="./main.js"></script>
</body>
</html>
