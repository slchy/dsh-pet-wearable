# dsh profile patch：把眼镜相机与会话控制挂成 MCP 工具
#
# 用法：dsh --profile sdk --patch <仓库绝对路径>/mcp/camera.yml
# 工具名对模型是 mcp__camera__take_photo 与 mcp__session__end_session。
#
# 注意 patch 的格式（见 dsh-app-boot 的 applyEntryPatches）：
#   - 裸条目 = 按 id 覆盖已有节点，找不到就报 "entry not found"
#   - 要**新增**节点必须用 `insert:`，不带顶层 id 时追加到最外层
#
# args 里是绝对路径，部署到别处时要改成实际位置（或换成相对 cwd 的写法）。
#
# 两个工具都只 POST 本机控制口（默认 listen+2），真正的硬件/连接动作在 harness 里：
#   take_photo  → harness 经常驻 TCP 让手机复用 WakeUpEvent 的
#                 transactionId/requestId 发 multiModel，再把 JPEG 回给它
#   end_session → harness 挂「本轮说完就结束」的旗子，播完断开连接

# ---- 主对话常驻：bash 前台最多等 1 s，超时自动转后台 job ----
#
# 这是全双工能成立的前提：前台跑命令会把主对话整个占住，这几秒里用户说什么都
# 进不来（真机 05:40:37 那次网上搜索占了 10.19 s，用户问「你查好了吗」排到了
# 这一轮之后）。dsh 的 bash 工具本身带 promoteOnTimeout：跑过 timeoutMs 之后
# **不杀**命令，而是继续当 job 跑，调用返回
# `[still running after <ms>; moved to background job <id>]`，主对话立刻自由。
#
# 所以不需要在应用层猜用户在问什么（关键词匹配既是漏判也是误伤），
# 也不需要提示词逼模型"一律派后台"——调短等待就够了，一个主对话能同时挂多个 job。
#
# 为什么是 1 s 而不是 3 s：`ls` / `git status` / `cat` 这类毫秒级命令一秒内必定
# 返回，不受影响；而编译、探索、开别的 harness 本来就不该在**前台**跑，它们多卡
# 2 秒就是主对话多失聪 2 秒。提示词那边已经按「要不要当场拿结果」分了层，这里
# 只是把判断失手的代价压低。
- id: bash-sandbox
  config:
    timeoutMs: 1000
    # 模型自己传 timeoutMs 也不能把它拉长，否则它一问就又把主对话堵回去
    maxTimeoutMs: 1000

# 子代理开满思考。
#
# `agentOptions` 不是 volatile 字段（`llm-deepseek` / `agent-default-model` 的
# 那些才是），所以这里能通过配置生效。只设 reasoningEffort、不设 provider/model，
# 子代理就继承父会话的路由 —— **同一个模型，但想得更透**。
#
# 为什么不是主会话也想得透：真机实测同一个「你好」，high 档有一次想了 2916 字 /
# 10 秒还没出正文（多 step 只在吐 reasoning、`text 0 字`）。语音要的是快，所以
# 主会话关掉（见 profile 的 llm-deepseek.reasoningEffort=off），把"想得多"搬到
# 调查、查资料这类真正需要推理的活儿上 —— 那正是 subagent 的用途。
- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    agentOptions:
      reasoningEffort: max

- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    agentOptions:
      reasoningEffort: max

# 显式写死这两项，不靠默认值：
# - `promoteOnTimeout`：超时不杀，转后台。**这是 1 s 安全的前提** —— 如果它被关掉，
#   1 秒就是把命令直接杀掉。
# - `enableRunInBackground`：允许模型自己主动选择后台跑，不必等超时。
# 字段定义见 `@deepseek-ai/dsh-tool-bash` 的 config schema（两者默认都是 true，
# 但默认值是别人的代码，写死才不会被下次升级悄悄改掉）。
- id: tool-bash
  config:
    promoteOnTimeout: true
    enableRunInBackground: true

# 同上，`job_output wait:true` 默认会等 **30 秒**（dsh-tool-jobs 的
# `waitTimeoutMs ?? 3e4`）—— 模型刚被踢到后台，转头又用 job_output 干等，
# 主对话照样被堵（实测：sleep 8 转后台后，它又等 5 秒把结果取回来）。
# 压到 1 秒：拿不到就结束这一轮，job 结算时系统会主动叫它（completionDelivery）。
- id: tool-jobs
  config:
    waitTimeoutMs: 1000
    maxWaitTimeoutMs: 1000

# `web_search` 是**同步**的：它在跑的时候主对话整个被占住，用户说什么都进不来。
# base bundle 给的是 60 000 ms —— 一次慢搜索等于失聪一分钟，比不搜更糟。
# 真机实测一次两查询的搜索 5.6 s 就回来了，20 s 足够覆盖慢网；超时让它失败并
# 重试一次，比干等一分钟好。
- id: tool-web
  config:
    searchTimeoutMs: 20000

# 长期记忆靠 `agent-instructions` 注入：它把工作区里的指令文件当系统提示词的一部分
# 读进去，所以记忆**每轮都在**，不用调工具去取（多一次工具调用就是多一轮往返，
# 实测 +1.2 s）。代价是改 `MEMORY.md` 会让下一轮的前缀缓存失效一次。
- id: agent-instructions
  config:
    maxBytes: 65536
    instructionFileCandidates:
      - MEMORY.md

- insert:
    - id: mcp-camera
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: camera
        transport: stdio
        command: node
        args:
          - /path/to/dsh-pet-wearable/mcp/mcp-camera.mjs
        # 不带任何设备参数：工具表由 server 运行时从 harness 的
        # `GET /capabilities` 现查现生成。换设备只改设备适配层，这里和 MCP 代码都不用动。
        toolCallTimeoutMs: 30000
        failOnStartupError: false
    - id: mcp-session
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: session
        transport: stdio
        command: node
        args:
          - /path/to/dsh-pet-wearable/mcp/mcp-session.mjs
        toolCallTimeoutMs: 10000
        failOnStartupError: false
    - id: mcp-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: memory
        transport: stdio
        command: node
        args:
          - /path/to/dsh-pet-wearable/mcp/mcp-memory.mjs
        toolCallTimeoutMs: 10000
        failOnStartupError: false
    # 在过去的对话里搜。会话日志是多帧 zstd 的 JSONL，自己扫比走 dsh 的内部
    # 索引简单（那个是服务不是工具，模型够不到）。
    - id: mcp-sessions
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: sessions
        transport: stdio
        command: node
        args:
          - /path/to/dsh-pet-wearable/mcp/mcp-sessions.mjs
        toolCallTimeoutMs: 15000
        failOnStartupError: false
